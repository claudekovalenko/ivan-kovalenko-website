<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Well Done — Coming soon</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --gold: #d6a85c; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #f5f3ef;
      font: 400 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: radial-gradient(55% 45% at 50% 0%, rgba(214, 168, 92, 0.28), transparent 70%), #0a0a0a;
    }
    .kicker { margin: 0 0 1.6em; font-size: 0.8rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); }
    h1 {
      margin: 0 0 0.3em;
      font-size: clamp(3.6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 0.88;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #fff 30%, #c9c2b6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 0; color: #9a958d; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Coming soon</p>
    <h1>Well Done</h1>
    <p>Something good is on the way.</p>
  </main>
</body>
</html>
