name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/dazzling-galileo-bp98s3"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir _site
          if [ -f PRIVATE ]; then
            # Site is hidden: publish only the "Coming soon" page.
            cp coming-soon.html _site/index.html
            cp -r CNAME assets _site/
            printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          else
            cp -r index.html styles.css main.js config.js CNAME assets _site/
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
